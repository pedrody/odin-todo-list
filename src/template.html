<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Todo List</title>
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-user">
            <div class="user-profile"></div>
            <h1>@username</h1>
        </div>

        <div id="projects">
        </div>

        <div class="sidebar-actions">
            <button id="new-project-btn">+ New project</button>
        </div>
    </div>

    <div class="content">
        <header class="content-header">
            <h1>Project's name here</h1>
        </header>
        <div class="kanban">
            <div class="column">
                <h1>Column name</h1>

                <div class="task-card">
                    <h2>My first task</h2>
                </div>
                <div class="task-card">
                    <h2>My second task</h2>
                </div>
            </div>
            <div class="column">
                <h1>Column name</h1>

                <div class="task-card">
                    <h2>Another task</h2>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
